<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<body>
  
<div class="cabecalho">
 <h1>Cadastro de Produto</h1>
 </div>
   
    <nav>
    <a href="index.html">Início</a>
    <a href="ClientePag.html">Clientes</a>
    <a href="ProdutosPag.html" aria-current="page">Produtos</a>
    <a href="Cadastrados.html">Produtos Ativos</a>
    <a href="Ativos.html">Clientes Ativos</a>
</nav>
   
   <div class="container">
       
    <form id="formProduto">

        <div class="campo">
            <label for="nome">Nome do produto</label>
            <input type="text" id="nome" required>
        </div>

        <div class="campo">
            <label for="preco">Preço</label>
            <input type="number" id="preco" step="0.01" required>
        </div>

        <div class="campo">
            <label for="estoque">Estoque</label>
            <input type="number" id="estoque" required>
        </div>

        <button type="submit" id="p">Cadastrar produto</button>

    </form>


  

</div>

<script src="script.js"></script>
</body>
